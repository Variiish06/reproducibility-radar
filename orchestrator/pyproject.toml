[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reproducibility-radar"
version = "0.1.0"
description = "Nightly agent that verifies ML paper reproducibility"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.0",
    "anthropic>=0.40.0",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.27.0",
    "pypdf>=4.3.0",
    "pydantic>=2.8.0",
    "python-docx>=1.1.2",
    "tenacity>=8.5.0",
    "structlog>=24.4.0",
    "arxiv>=2.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["radar"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["radar"]

[tool.ruff.format]
quote-style = "double"

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
